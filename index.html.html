<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egy kis meglepetés ❤️</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#3d1d2d 0%,#17131f 48%,#0c0c12 100%);font-family:Georgia,'Times New Roman',serif;color:#fff4ed;text-align:center}.glow{position:fixed;width: min(80vw,620px);aspect-ratio:1;border-radius:50%;background:#ff52751a;filter:blur(65px);pointer-events:none}.wrap{position:relative;padding:28px;max-width:800px;width:100%}.hint{font:500 12px/1.5 system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#e8c6cd;margin-bottom:28px}.heart-button{border:0;background:transparent;color:#ff6f91;font-size:clamp(100px,24vw,190px);line-height:1;cursor:pointer;filter:drop-shadow(0 0 24px #ff477b66);transition:transform .25s,filter .25s;animation:pulse 1.8s infinite}.heart-button:hover{transform:scale(1.08);filter:drop-shadow(0 0 36px #ff477bcc)}.heart-button:focus-visible{outline:2px solid #fff;border-radius:20px}.tap{font:15px system-ui,sans-serif;color:#e8c6cd;margin-top:20px}.message{display:none;opacity:0;transform:translateY(14px);transition:opacity .8s,transform .8s}.message.show{display:block}.message.visible{opacity:1;transform:translateY(0)}h1{font-size:clamp(42px,9vw,92px);font-weight:400;line-height:1.04;letter-spacing:.02em;margin:0;text-shadow:0 3px 35px #ff769455}.little-heart{font:40px system-ui,sans-serif;color:#ff829d;margin:22px 0 10px}.bu{font-size:clamp(25px,5vw,42px);letter-spacing:.16em;color:#f2c9c7}.again{margin-top:35px;border:1px solid #ffffff42;border-radius:30px;background:#ffffff0a;color:#f7dce1;padding:10px 18px;cursor:pointer;font:13px system-ui,sans-serif}.again:hover{background:#ffffff15}.spark{position:fixed;bottom:-30px;pointer-events:none;animation:float 5s linear forwards;font-size:20px;opacity:.8}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="glow"></div><main class="wrap"><div class="hint" id="hint">Van egy apró meglepetésem neked</div><button class="heart-button" id="heart" aria-label="Kattints a szívre a meglepetésért">♥</button><div class="tap" id="tap">Koppints a szívre ❤️</div><section class="message" id="message" aria-live="polite"><h1>NAGYON<br>SZERETLEK</h1><div class="little-heart">♡</div><div class="bu">BU &lt;3</div><button class="again" id="again">Még egyszer megnézem</button></section></main>
<script>
const heart=document.getElementById('heart'), message=document.getElementById('message'), tap=document.getElementById('tap'), hint=document.getElementById('hint');let opened=false;
function burst(){for(let i=0;i<18;i++){const s=document.createElement('span');s.className='spark';s.textContent=['♥','♡','✦'][Math.floor(Math.random()*3)];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(3+Math.random()*3)+'s';s.style.fontSize=(12+Math.random()*20)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),6500)}}
heart.addEventListener('click',()=>{if(opened)return;opened=true;heart.style.display='none';tap.style.display='none';hint.style.display='none';message.classList.add('show');requestAnimationFrame(()=>message.classList.add('visible'));burst()});
document.getElementById('again').addEventListener('click',()=>{opened=false;message.classList.remove('visible');setTimeout(()=>{message.classList.remove('show');heart.style.display='inline-block';tap.style.display='block';hint.style.display='block'},250)});
</script></body></html>
